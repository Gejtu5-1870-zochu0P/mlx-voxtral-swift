name: Verify Voxtral TTS Demo

on:
  workflow_dispatch:
  push:
    paths:
      - 'Package.swift'
      - 'Sources/**'
      - '.github/workflows/verify-tts-demo.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build TTS demo
        run: swift build --configuration release --product VoxtralTTSStreamingDemo

      - name: Create macOS app bundle
        shell: bash
        run: |
          set -euo pipefail

          BIN_PATH="$(swift build --configuration release --show-bin-path)"
          APP_DIR="$PWD/VoxtralTTSStreamingDemo.app"

          test -f "$BIN_PATH/VoxtralTTSStreamingDemo"

          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"

          cp "$BIN_PATH/VoxtralTTSStreamingDemo" \
            "$APP_DIR/Contents/MacOS/VoxtralTTSStreamingDemo"

          for bundle in "$BIN_PATH"/*.bundle; do
            if [[ -d "$bundle" ]]; then
              cp -R "$bundle" "$APP_DIR/Contents/Resources/"
            fi
          done

          cat > "$APP_DIR/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>VoxtralTTSStreamingDemo</string>
              <key>CFBundleIdentifier</key>
              <string>com.vincentgourbin.voxtral-tts-demo</string>
              <key>CFBundleName</key>
              <string>Voxtral TTS Demo</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>15.0</string>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          PLIST

          plutil -lint "$APP_DIR/Contents/Info.plist"

      - name: Sign and verify macOS app
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR="$PWD/VoxtralTTSStreamingDemo.app"
          EXECUTABLE="$APP_DIR/Contents/MacOS/VoxtralTTSStreamingDemo"

          test -f "$EXECUTABLE"
          test -f "$APP_DIR/Contents/Info.plist"

          codesign --force --sign - --timestamp=none "$EXECUTABLE"
          codesign --force --deep --sign - --timestamp=none "$APP_DIR"

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          plutil -lint "$APP_DIR/Contents/Info.plist"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: VoxtralTTSStreamingDemo-macOS
          path: VoxtralTTSStreamingDemo.app
          if-no-files-found: error
          retention-days: 7
